[package]
name = "ariai"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Native Rust downloader, working towards aria2 feature parity"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
cookie_store = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
httpdate = "1"
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
md-5 = "0.10"
percent-encoding = "2"
quick-xml = "0.42"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
strip = true

